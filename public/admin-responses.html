<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Responses</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#182033;--muted:#697386;--line:#e4e8f0;--accent:#5b5ce2;--good:#16845b;--bad:#c0394b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:1280px;margin:auto;padding:28px 20px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--accent)}
h1{margin:6px 0 4px}
h2{margin:0}
p{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px #18203312}
.session-card{margin-bottom:18px}
.session-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f7f7ff;border:1px solid #dddfff;border-radius:12px;padding:14px;word-break:break-all;font-size:14px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.meta-item{padding:14px;background:#fafbfe;border:1px solid var(--line);border-radius:12px}
.meta-item span{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}
.meta-item strong{display:block;margin-top:5px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;white-space:nowrap}
.time-fast{color:#475467;font-weight:800}.time-good{color:var(--good);font-weight:800}.time-near{color:#b54708;font-weight:800}.time-timeout{color:var(--bad);font-weight:900}
.result-good{color:var(--good);font-weight:800}.result-bad{color:var(--bad);font-weight:800}
.section-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
.section-card{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}
.section-card h3{margin:0 0 10px;font-size:16px}
.section-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.section-stat{padding:10px;background:#fafbfe;border-radius:10px}
.section-stat span{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800}
.section-stat strong{display:block;margin-top:3px;font-size:16px}
.flag{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:8px;font-size:11px;font-weight:900}
.flag.good{background:#edf9f3;color:#126a49}.flag.watch{background:#fff7e8;color:#9a5d00}.flag.needs{background:#fff0f2;color:#a52e3e}
.improvement{margin-bottom:18px}
.improvement h2{font-size:18px;margin-bottom:10px}
.improvement-list{display:grid;gap:8px}
.improvement-item{padding:11px 13px;border-radius:10px;background:#fff7e8;color:#7a4b00;font-weight:700}
.improvement-item.needs{background:#fff0f2;color:#a52e3e}
@media(max-width:800px){.meta{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column}.section-grid{grid-template-columns:1fr}}
.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.error{color:var(--bad)}
@media(max-width:800px){.meta{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <div class="eyebrow">APTITUDE PRACTICE ADMIN</div>
      <h1>Session Responses</h1>
      <p>Question-by-question response record for this test session.</p>
    </div>
    <button class="back" onclick="window.close();">Close Page</button>
  </div>

  <section id="content" class="hidden"></section>
  <section id="error" class="card error hidden"></section>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(url){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json"}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed");return d;}
function timeFlag(r){if(r.timed_out)return["Timed out","time-timeout"];const s=Number(r.response_seconds||0);if(s<=10)return["Very fast","time-fast"];if(s<=25)return["On pace","time-good"];return["Near limit","time-near"];}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){
  const id=new URLSearchParams(location.search).get("id");
  if(!id)throw new Error("Missing attempt id.");
  const data=await api("/api/admin/attempts/"+encodeURIComponent(id)+"/responses");
  const a=data.attempt,r=data.responses||[];
  const total=a.question_count||r.length;
  const writing=data.writing_responses||[];
  const html=`
    <section class="card session-card">
      <div class="eyebrow">STUDENT</div>
      <h2>${esc(a.session_name||"Student")}</h2>
      <p>Session ID</p>
      <div class="session-id">${esc(a.session_id||"-")}</div>
      <div class="meta">
        <div class="meta-item"><span>Year</span><strong>${esc(a.year_level||"-")}</strong></div>
        <div class="meta-item"><span>Started</span><strong>${esc(new Date(a.started_at).toLocaleString())}</strong></div>
        <div class="meta-item"><span>Questions</span><strong>${esc(total)}</strong></div>
        <div class="meta-item"><span>Score</span><strong>${a.score==null?"-":esc(a.score+"%")}</strong></div>
      </div>
    </section>
    <section id="sectionSummary" class="section-grid"></section>
    <section id="improvement" class="card improvement">
      <h2>Areas for Improvement</h2>
      <div id="improvementList" class="improvement-list"></div>
    </section>
    <section class="card" style="margin-bottom:18px">
      <div class="eyebrow">WRITTEN EXPRESSION</div>
      <h2>Writing Responses</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Task</th><th>Response</th><th>Submitted</th></tr></thead>
          <tbody>
            ${writing.length ? writing.map(x=>`<tr><td>${esc(x.task_id)}</td><td style="white-space:pre-wrap;min-width:420px">${esc(x.response_text)}</td><td>${esc(new Date(x.submitted_at).toLocaleString())}</td></tr>`).join("") : '<tr><td colspan="3">No writing response recorded.</td></tr>'}
          </tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Question</th><th>Section</th><th>Selected</th><th>Correct</th><th>Result</th><th>Time</th><th>Flag</th><th>Answered</th></tr></thead>
          <tbody>
            ${r.map((x,i)=>{const answered=Boolean(x.answered);const flag=answered?timeFlag(x):["",""];const result=!answered?"Not answered":x.timed_out?"Timed out":x.is_correct?"Correct":"Wrong";const resultClass=!answered?"":x.is_correct?"result-good":"result-bad";const options=Array.isArray(x.answer_options)?x.answer_options:[];const optionHtml=options.map((option,index)=>{const label=String.fromCharCode(65+index);const isCorrect=Number(x.correct_answer)===index;return `<div${isCorrect?' style="font-weight:800"':""}>${label}. ${esc(option)}${isCorrect?" <strong>(Correct)</strong>":""}</div>`}).join("");const selectedText=answered&&x.selected_answer!=null&&options[x.selected_answer]!=null?String.fromCharCode(65+x.selected_answer)+" — "+String(options[x.selected_answer]):"-";const correctText=Number.isInteger(Number(x.correct_answer))&&options[x.correct_answer]!=null?String.fromCharCode(65+x.correct_answer)+" — "+String(options[x.correct_answer]):"-";const explanation=x.explanation?`<div style="margin-top:8px;color:var(--muted)"><strong>Explanation:</strong> ${esc(x.explanation)}</div>`:"";const questionHtml=`<div>${esc(x.question_text||("Question "+x.question_id))}</div><div style="margin-top:8px">${optionHtml}</div>${explanation}`;const answeredAt=answered&&x.answered_at?new Date(x.answered_at).toLocaleString():"-";const elapsed=answered?Number(x.response_seconds||0).toFixed(1)+"s":"-";return `<tr><td>${i+1}</td><td style="min-width:420px">${questionHtml}</td><td>${esc(x.section||"-")}</td><td>${esc(selectedText)}</td><td>${esc(correctText)}</td><td class="${resultClass}">${result}</td><td>${elapsed}</td><td class="${flag[1]}">${flag[0]}</td><td>${esc(answeredAt)}</td></tr>`}).join("")}
          </tbody>
        </table>
      </div>
    </section>`;
  $("content").innerHTML=html;

  const order=["humanities","mathematics_science"];
  const labels={humanities:"Humanities",mathematics_science:"Mathematics & Science"};
  const grouped={};
  order.forEach(section=>grouped[section]={correct:0,total:0,time:0,timeouts:0});
  r.forEach(x=>{
    const section=x.section;
    if(!grouped[section])grouped[section]={correct:0,total:0,time:0,timeouts:0};
    grouped[section].total++;
    grouped[section].correct+=x.is_correct?1:0;
    grouped[section].time+=Number(x.response_seconds||0);
    grouped[section].timeouts+=x.timed_out?1:0;
  });

  const improvement=[];
  $("sectionSummary").innerHTML=order.filter(section=>grouped[section].total>0).map(section=>{
    const g=grouped[section];
    const accuracy=g.total?g.correct/g.total*100:0;
    const avg=g.total?g.time/g.total:0;
    const needsAccuracy=accuracy<70;
    const slow=avg>25;
    const timeout=g.timeouts>0;
    const severity=(needsAccuracy||slow||timeout)?"needs":(accuracy<85||avg>20)?"watch":"good";
    const flag=severity==="needs"?"Needs attention":severity==="watch"?"Watch this area":"On track";
    if(needsAccuracy)improvement.push({type:"needs",text:labels[section]+" — accuracy is "+accuracy.toFixed(0)+"%."});
    if(slow)improvement.push({type:"watch",text:labels[section]+" — average response time is "+avg.toFixed(1)+"s, above the 30s practice limit."});
    if(timeout)improvement.push({type:"needs",text:labels[section]+" — "+g.timeouts+" timed-out question"+(g.timeouts===1?"":"s")+"."});
    return `<article class="section-card">
      <h3>${labels[section]}</h3>
      <div class="section-stats">
        <div class="section-stat"><span>Questions</span><strong>${g.total}</strong></div>
        <div class="section-stat"><span>Total time</span><strong>${(g.time/60).toFixed(1)} min</strong></div>
        <div class="section-stat"><span>Avg / question</span><strong>${avg.toFixed(1)}s</strong></div>
      </div>
      <div class="section-stats" style="margin-top:8px">
        <div class="section-stat"><span>Accuracy</span><strong>${accuracy.toFixed(0)}%</strong></div>
        <div class="section-stat"><span>Timed out</span><strong>${g.timeouts}</strong></div>
        <div class="section-stat"><span>Correct</span><strong>${g.correct}/${g.total}</strong></div>
      </div>
      <span class="flag ${severity}">${flag}</span>
    </article>`;
  }).join("");

  $("improvementList").innerHTML=improvement.length
    ? improvement.map(x=>`<div class="improvement-item ${x.type==="needs"?"needs":""}">${x.text}</div>`).join("")
    : '<div class="improvement-item" style="background:#edf9f3;color:#126a49">No immediate improvement flags from this attempt.</div>';

  $("content").classList.remove("hidden");
}
load().catch(e=>{$("error").textContent=e.message;$("error").classList.remove("hidden");});
</script>
</body>
</html>
