<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600"><rect width="1100" height="600" fill="white"/><text x="550" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Migration Between Settlement Types</text><g font-family="Arial" font-size="18" text-anchor="middle"><rect x="80" y="180" width="210" height="100" fill="#eee" stroke="#222" stroke-width="3"/><text x="185" y="220">Rural</text><text x="185" y="250">settlements</text><rect x="445" y="100" width="210" height="100" fill="#eee" stroke="#222" stroke-width="3"/><text x="550" y="140">Smaller urban</text><text x="550" y="170">communities</text><rect x="810" y="180" width="210" height="100" fill="#eee" stroke="#222" stroke-width="3"/><text x="915" y="220">Large urban</text><text x="915" y="250">centres</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><g stroke="#333" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M290 200 C360 150 390 150 445 150"/><path d="M655 150 C720 150 750 190 810 210"/><path d="M810 260 C720 330 600 330 290 260"/><path d="M445 190 C380 260 340 300 290 270"/></g><text x="550" y="430" text-anchor="middle" font-family="Arial" font-size="16">Separate categories reveal smaller flows hidden by overall totals.</text><text x="550" y="470" text-anchor="middle" font-family="Arial" font-size="16">Movement occurs in more than one direction.</text></svg>