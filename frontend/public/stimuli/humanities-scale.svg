<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"><rect width="1000" height="520" fill="white"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">How a Style May Be Judged Over Time</text><line x1="110" y1="250" x2="890" y2="250" stroke="#333" stroke-width="5"/><g font-family="Arial" font-size="17" text-anchor="middle"><text x="120" y="205">Unacceptable</text><text x="245" y="205">Daring</text><text x="370" y="205">Fashionable</text><text x="500" y="205">Old-fashioned</text><text x="635" y="205">Quaint</text><text x="760" y="205">Charming</text><text x="880" y="205">Beautiful</text></g><g fill="#333"><circle cx="120" cy="250" r="10"/><circle cx="245" cy="250" r="10"/><circle cx="370" cy="250" r="10"/><circle cx="500" cy="250" r="10"/><circle cx="635" cy="250" r="10"/><circle cx="760" cy="250" r="10"/><circle cx="880" cy="250" r="10"/></g><text x="500" y="410" text-anchor="middle" font-family="Arial" font-size="17">The scale describes changing social judgement, not an objective ranking.</text></svg>